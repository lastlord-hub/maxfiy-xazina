name: Build Android APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm install
      - run: npx cap add android

      - name: Capacitor standart MainActivity faylini tekshirish va ochirish
        run: |
          echo "Capacitor java papkasi tarkibi:"
          find android/app/src/main/java -type f
          find android/app/src/main/java -name "MainActivity.java" -delete
          echo "Ochirilgandan keyin:"
          find android/app/src/main/java -type f

      - name: Bizning Kotlin fayllarimizni kochirish
        run: |
          mkdir -p android/app/src/main/java/com/maxfiyxazina/app
          cp android-native/app/src/main/java/com/maxfiyxazina/app/*.kt android/app/src/main/java/com/maxfiyxazina/app/
          echo "Nusxalangandan keyin:"
          find android/app/src/main/java -type f

      - name: AndroidManifest ni birlashtirish
        run: |
          echo "Capacitor generatsiya qilgan manifest:"
          cat android/app/src/main/AndroidManifest.xml
          cp android-native/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml
          cp -f android-native/app/src/main/res/xml/*.xml android/app/src/main/res/xml/

      - name: Kotlin plugin va biometric kutubxonasini qoshish
        run: |
          if ! grep -q "kotlin-android" android/app/build.gradle; then
            sed -i "1i apply plugin: 'kotlin-android'" android/app/build.gradle
          fi
          if ! grep -q "androidx.biometric" android/app/build.gradle; then
            sed -i '/dependencies {/a\    implementation "androidx.biometric:biometric:1.2.0-alpha05"' android/app/build.gradle
          fi
          if ! grep -q "core-ktx" android/app/build.gradle; then
            sed -i '/dependencies {/a\    implementation "androidx.core:core-ktx:1.13.1"' android/app/build.gradle
          fi
          if ! grep -q "kotlin-gradle-plugin" android/build.gradle; then
            sed -i "/classpath 'com.android.tools.build:gradle/a\\        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'" android/build.gradle
          fi
          echo "----- app/build.gradle (raqamlangan) -----"
          cat -n android/app/build.gradle
          echo "----- build.gradle (raqamlangan) -----"
          cat -n android/build.gradle

      - name: minSdkVersion ni 26 ga oshirish (Autofill uchun shart)
        run: |
          echo "Ozgartirishdan oldin:"
          cat android/variables.gradle
          python3 -c "
import re
with open('android/variables.gradle', 'r') as f:
    content = f.read()
# minSdkVersion so'zidan keyin keladigan har qanday sonni (= bilan yoki = siz) 26 ga almashtiradi
content = re.sub(r'minSdkVersion(\s*=?\s*)\d+', r'minSdkVersion\g<1>26', content)
with open('android/variables.gradle', 'w') as f:
    f.write(content)
"
          echo "Ozgartirishdan keyin:"
          cat android/variables.gradle

      - name: Capacitor sync
        run: npx cap sync android

      - name: Gradle ruxsat
        run: chmod +x android/gradlew

      - name: APK yasash
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: APK saqlash
        uses: actions/upload-artifact@v4
        with:
          name: maxfiy-xazina-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
